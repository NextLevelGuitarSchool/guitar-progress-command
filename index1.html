<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLG Student Console</title>
<style>
:root{
  --bg:#050706;
  --steel:#151a16;
  --steel2:#222923;
  --panel:#101510;
  --line:#586255;
  --line2:#394238;
  --orange:#f39a20;
  --gold:#d9aa43;
  --green:#7ce970;
  --red:#e4503b;
  --cream:#eee1b0;
  --muted:#99a393;
  --screen:#07150a;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--cream);font-family:Arial,Helvetica,sans-serif}
body{padding:8px}
button,select{font:inherit}
.console{
  max-width:1600px;
  margin:auto;
  min-height:calc(100vh - 16px);
  padding:16px;
  border:4px solid #080a08;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% -10%,rgba(130,150,120,.15),transparent 36%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px),
    linear-gradient(#1a201a,#0d110e);
  box-shadow:inset 0 0 0 2px #4c5549,inset 0 0 60px rgba(0,0,0,.85);
  overflow:hidden;
}
.panel{
  background:linear-gradient(rgba(255,255,255,.025),rgba(0,0,0,.25)),var(--steel);
  border:2px solid var(--line);
  box-shadow:inset 0 0 18px rgba(0,0,0,.7);
}
.cut{
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.screen{
  background:linear-gradient(#061108,#0a2110);
  border:1px solid #3d583e;
  color:var(--green);
  text-shadow:0 0 8px rgba(124,233,112,.45);
  box-shadow:inset 0 0 14px rgba(0,0,0,.85);
}
.tiny,.section-title{
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--gold);
  font-weight:800;
}
.top{
  display:grid;
  grid-template-columns:1.15fr 1.7fr 1.15fr;
  gap:10px;
  align-items:stretch;
}
.profile{
  display:grid;
  grid-template-columns:88px 1fr;
  gap:10px;
  align-items:center;
  padding:11px;
}
.photo,.photo-placeholder{
  width:88px;height:88px;
  border:2px solid var(--orange);
  background:#0a0d0a;
  object-fit:cover;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.photo-placeholder{
  display:grid;place-items:center;text-align:center;
  font-size:11px;color:#697268;
  background:repeating-linear-gradient(135deg,#151a16 0 8px,#101410 8px 16px)
}
.student-name{
  padding:8px;
  margin-top:5px;
  font-family:monospace;
  font-size:clamp(20px,2.2vw,34px);
}
.credits{font-family:monospace;margin-top:6px;font-size:13px}
.logo-shell{
  position:relative;
  min-height:138px;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.logo-bump{
  position:absolute;
  top:-20px;
  left:14%;
  right:14%;
  height:58px;
  border:2px solid #667063;
  border-bottom:0;
  background:linear-gradient(#252c25,#151a16);
  clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 100%,0 100%);
  z-index:0;
}
.logo-wrap{position:relative;z-index:1}
.logo{
  max-width:76%;
  max-height:122px;
  object-fit:contain;
  filter:drop-shadow(0 7px 8px #000);
}
.brand{
  margin-top:-2px;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.controls{
  padding:11px;
  display:grid;
  gap:8px;
  align-content:center;
}
select,.btn{
  width:100%;
  padding:9px;
  border:1px solid #556052;
  border-radius:5px;
  background:#08120a;
  color:var(--green);
}
.btn{cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}
.lamp.error{background:var(--red);box-shadow:0 0 9px var(--red)}

.skills-panel{margin-top:10px;padding:10px}
.skills-grid{
  margin-top:8px;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}
.skill{
  min-width:0;
  padding:8px;
  background:#101510;
  border:1px solid #475144;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:7px;
}
.skill.offline{opacity:.45;filter:saturate(.35)}
.skill-head{
  display:flex;justify-content:space-between;gap:6px;align-items:center
}
.skill-number{font-family:monospace;color:var(--green);font-size:18px}
.skill-label{
  text-transform:uppercase;color:var(--orange);font-size:12px;font-weight:800;
  overflow-wrap:anywhere;text-align:right
}
.skill-text{
  padding:8px;
  min-height:68px;
  font-family:monospace;
  font-size:12px;
  line-height:1.3;
}
.skill-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px}
.knob{
  width:48px;height:48px;border-radius:50%;position:relative;border:3px solid #070807;
  background:radial-gradient(circle at 35% 28%,#777,#252525 58%,#080808 73%);
  box-shadow:inset 0 0 0 2px #555,0 3px 7px #000
}
.knob::after{
  content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);
  width:4px;height:18px;background:var(--orange);border-radius:3px
}
.module-state{
  padding:5px 7px;
  border:1px solid #45503f;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
}

.rep-panel{margin-top:10px;padding:10px}
.rep-grid{
  margin-top:8px;
  display:grid;
  grid-template-columns:repeat(10,minmax(48px,1fr));
  gap:5px;
}
.rep{
  min-width:0;
  background:#101510;
  border:1px solid #475144;
  padding:5px;
  display:grid;
  grid-template-rows:46px 150px auto;
  gap:5px;
  text-align:center;
}
.rep.empty{opacity:.28}
.folder-img{
  width:100%;height:46px;object-fit:contain;
  background:#0b100c;border:1px solid #394337
}
.folder-fallback{
  height:46px;display:grid;place-items:center;
  border:1px solid #394337;color:#606a5f;font-size:10px
}
.segments{
  display:flex;
  flex-direction:column-reverse;
  gap:4px;
  justify-content:flex-start;
  min-height:0;
}
.seg{
  flex:1;
  min-height:9px;
  max-height:16px;
  border-radius:2px;
  background:#242a23;
  border:1px solid rgba(255,255,255,.08);
  opacity:.38
}
.seg.progress{background:var(--orange);opacity:1;box-shadow:0 0 7px rgba(243,154,32,.75)}
.seg.complete{background:var(--green);opacity:1;box-shadow:0 0 7px rgba(124,233,112,.78)}
.rep-name{
  min-height:24px;
  color:var(--gold);
  text-transform:uppercase;
  font-size:9px;
  line-height:1.1;
  overflow-wrap:anywhere
}
.rep-score{font-family:monospace;font-size:11px;margin-top:3px}
.legend{
  margin-top:8px;
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px
}
.key{display:flex;align-items:center;gap:6px}
.swatch{width:17px;height:8px;border-radius:2px}
.dark{background:#252b24;border:1px solid #555}
.amber{background:var(--orange)}
.green{background:var(--green)}

.footer{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1.8fr 1fr;
  gap:10px;
  align-items:stretch
}
.footer > div{padding:10px}
.motto{
  display:grid;place-items:center;text-align:center;
  font-size:clamp(20px,2vw,32px);
  letter-spacing:.12em;
  color:var(--orange);
  font-weight:800
}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.error{
  display:none;margin-top:10px;padding:10px;
  border:1px solid var(--red);background:#2a100d;color:#ffd5cf
}
.error.show{display:block}

@media(max-width:1050px){
  .top{grid-template-columns:1fr 1.2fr}
  .controls{grid-column:1/-1;grid-template-columns:1fr auto auto}
  .skills-grid{grid-template-columns:repeat(3,1fr)}
  .rep-grid{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:720px){
  body{padding:4px}
  .console{padding:9px;border-radius:14px}
  .top{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr}
  .skills-grid{grid-template-columns:1fr}
  .rep-grid{grid-template-columns:repeat(5,1fr)}
  .footer{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="console">
  <header class="top">
    <section class="panel cut profile">
      <div id="photoWrap" class="photo-placeholder">STUDENT<br>PHOTO</div>
      <div>
        <div class="tiny">Student Profile</div>
        <div id="studentName" class="screen student-name">Loading…</div>
        <div class="credits">Credits: <span id="credits">0</span></div>
      </div>
    </section>

    <section class="panel cut logo-shell">
      <div class="logo-bump"></div>
      <div class="logo-wrap">
        <img src="nlg-logo.png" class="logo" alt="NLG metallic logo">
        <div class="brand">Next Level Guitar School</div>
      </div>
    </section>

    <section class="panel cut controls">
      <div class="tiny">Student Select</div>
      <select id="studentSelect"><option>Loading students…</option></select>
      <button id="refreshBtn" class="btn" type="button">Refresh from Sheet</button>
      <div class="status">
        <span id="statusLamp" class="lamp"></span>
        <span id="statusText">Connecting to Google Sheets</span>
      </div>
    </section>
  </header>

  <section class="panel cut skills-panel">
    <div class="section-title">Skill Modules</div>
    <div id="skillsGrid" class="skills-grid"></div>
  </section>

  <section class="panel cut rep-panel">
    <div class="section-title">Repertoire Songs Status</div>
    <div id="repGrid" class="rep-grid"></div>
    <div class="legend">
      <span class="key"><span class="swatch dark"></span>Not completed</span>
      <span class="key"><span class="swatch amber"></span>In progress</span>
      <span class="key"><span class="swatch green"></span>Folder complete</span>
    </div>
  </section>

  <footer class="footer">
    <div class="panel cut note">Data source: Google Sheets<br><span id="lastUpdated">Not loaded yet</span></div>
    <div class="panel cut motto">Learn • Love • Play</div>
    <div id="objective" class="panel cut note">Select a student to load progress.</div>
  </footer>

  <div id="errorBox" class="error"></div>
</main>

<script>
(() => {
  "use strict";

  const SHEET_ID = "1Vi-arONxgRuPQ6p91Xdm4izBjhRgtp3DreOXwboCAms";
  const STUDENTS_TAB = "Students";
  const LIBRARY_TAB = "SRS Library";

  let students = [];
  let library = new Map();

  const $ = id => document.getElementById(id);
  const clean = v => String(v ?? "").replace(/\u200B/g,"").trim();
  const num = v => Math.max(0, Number(v) || 0);

  function cellValue(cell){
    if(!cell || cell.v === undefined || cell.v === null) return "";
    return cell.v;
  }

  function loadTab(tab){
    return new Promise((resolve,reject)=>{
      const oldGoogle = window.google;
      const script = document.createElement("script");
      const timeout = setTimeout(()=>{
        cleanup();
        reject(new Error(`Timed out loading "${tab}".`));
      },15000);

      function cleanup(){
        clearTimeout(timeout);
        script.remove();
        if(oldGoogle === undefined) delete window.google;
        else window.google = oldGoogle;
      }

      window.google = {
        visualization:{
          Query:{
            setResponse(response){
              cleanup();
              if(!response || response.status === "error"){
                reject(new Error(response?.errors?.[0]?.detailed_message || `Could not read "${tab}".`));
                return;
              }
              resolve(response.table);
            }
          }
        }
      };

      script.onerror = ()=>{
        cleanup();
        reject(new Error(`Could not load "${tab}". Check sharing and tab spelling.`));
      };

      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tab)}&tqx=out:json&headers=1&_=${Date.now()}`;
      document.head.appendChild(script);
    });
  }

  function tableObjects(table){
    const headers = table.cols.map((c,i)=>clean(c.label || c.id || `Column ${i+1}`));
    return (table.rows || []).map(r=>{
      const o = {__headers:headers};
      headers.forEach((h,i)=>o[h]=cellValue(r.c?.[i]));
      return o;
    });
  }

  function findHeader(headers,candidates){
    const norm = headers.map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
    for(const c of candidates){
      const target = c.toLowerCase().replace(/[^a-z0-9]/g,"");
      const idx = norm.indexOf(target);
      if(idx >= 0) return headers[idx];
    }
    return null;
  }

  function imageUrl(url){
    const value = clean(url);
    if(!value) return "";
    const match = value.match(/\/d\/([a-zA-Z0-9_-]+)/) || value.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500` : value;
  }

  function parseLibrary(rows){
    library = new Map();
    if(!rows.length) return;
    const h = rows[0].__headers;
    const nameKey = findHeader(h,["Name","Folder Name","SRS Name"]);
    const graphicKey = findHeader(h,["Graphic URL","Graphic","Image URL"]);
    const possibleKey = findHeader(h,["Possible","Total Possible","Required"]);
    const orderKey = findHeader(h,["Order","Display Order"]);

    if(!nameKey || !possibleKey){
      throw new Error('SRS Library requires "Name" and "Possible" columns.');
    }

    rows.forEach(r=>{
      const name = clean(r[nameKey]);
      if(!name) return;
      library.set(name.toLowerCase(),{
        name,
        graphic: graphicKey ? imageUrl(r[graphicKey]) : "",
        possible: Math.min(10,num(r[possibleKey])),
        order: orderKey ? num(r[orderKey]) : 999
      });
    });
  }

  function parseStudents(rows){
    if(!rows.length) return [];
    const h = rows[0].__headers;
    const nameKey = findHeader(h,["Student Name","Student"]);
    const photoKey = findHeader(h,["Photo URL","Student Photo","Photo"]);
    const creditsKey = findHeader(h,["Credits","Credit"]);
    if(!nameKey) throw new Error('Students tab requires a "Student Name" column.');

    const fixed = new Set([nameKey,photoKey,creditsKey].filter(Boolean));
    h.filter(x=>/^SRS\s*\d+\s*(Name|Folder|Achieved|Completed)$/i.test(x)).forEach(x=>fixed.add(x));
    const skillHeaders = h.filter(x=>!fixed.has(x)).slice(0,5);

    return rows.filter(r=>clean(r[nameKey])).map(r=>{
      const srs=[];
      for(let i=1;i<=10;i++){
        const folderKey = findHeader(h,[`SRS ${i} Name`,`SRS ${i} Folder`]);
        const achievedKey = findHeader(h,[`SRS ${i} Achieved`,`SRS ${i} Completed`]);
        srs.push({
          folder: folderKey ? clean(r[folderKey]) : "",
          achieved: achievedKey ? num(r[achievedKey]) : 0
        });
      }
      return {
        name:clean(r[nameKey]),
        photo:photoKey ? imageUrl(r[photoKey]) : "",
        credits:creditsKey ? num(r[creditsKey]) : 0,
        skills:skillHeaders.map(label=>({label,value:clean(r[label])})),
        srs
      };
    });
  }

  function setStatus(text,error=false){
    $("statusText").textContent=text;
    $("statusLamp").classList.toggle("error",error);
  }
  function showError(message){
    $("errorBox").textContent=message;
    $("errorBox").classList.add("show");
    setStatus("Connection error",true);
  }
  function clearError(){
    $("errorBox").classList.remove("show");
    $("errorBox").textContent="";
  }

  function renderPhoto(student){
    const wrap=$("photoWrap");
    wrap.innerHTML="";
    if(!student.photo){
      wrap.className="photo-placeholder";
      wrap.innerHTML="STUDENT<br>PHOTO";
      return;
    }
    const img=document.createElement("img");
    img.className="photo";
    img.src=student.photo;
    img.alt=`${student.name} student photo`;
    img.onerror=()=>{
      wrap.className="photo-placeholder";
      wrap.innerHTML="PHOTO<br>UNAVAILABLE";
    };
    wrap.className="";
    wrap.appendChild(img);
  }

  function renderSkills(student){
    const grid=$("skillsGrid");
    grid.innerHTML="";
    const items=[...student.skills];
    while(items.length<5){
      items.push({label:`OFFLINE ${items.length-2}`,value:""});
    }

    items.slice(0,5).forEach((s,i)=>{
      const offline=/^offline\b/i.test(s.label) || !clean(s.value);
      const card=document.createElement("article");
      card.className=`skill${offline?" offline":""}`;
      card.innerHTML=`
        <div class="skill-head">
          <div class="skill-number">${String(i+1).padStart(2,"0")}</div>
          <div class="skill-label"></div>
        </div>
        <div class="screen skill-text"></div>
        <div class="skill-bottom">
          <div class="knob" aria-hidden="true"></div>
          <div class="module-state">${offline?"System Offline":"Module Active"}</div>
        </div>`;
      card.querySelector(".skill-label").textContent=s.label || `OFFLINE ${i+1}`;
      card.querySelector(".skill-text").textContent=s.value || "SYSTEM OFFLINE";
      grid.appendChild(card);
    });
  }

  function renderRepertoire(student){
    const grid=$("repGrid");
    grid.innerHTML="";
    let next=null;

    student.srs.slice(0,10).forEach((slot,index)=>{
      const info=slot.folder ? library.get(slot.folder.toLowerCase()) : null;
      const possible=info ? Math.min(10,num(info.possible)) : 0;
      const achieved=Math.min(num(slot.achieved),possible);
      const complete=possible>0 && achieved===possible;

      if(possible>achieved && possible>0){
        const remaining=possible-achieved;
        if(!next || remaining<next.remaining) next={name:info?.name || slot.folder,remaining};
      }

      const card=document.createElement("article");
      card.className=`rep${!slot.folder?" empty":""}`;

      const top=document.createElement("div");
      if(info?.graphic){
        const img=document.createElement("img");
        img.className="folder-img";
        img.src=info.graphic;
        img.alt=`${info.name} folder graphic`;
        img.onerror=()=>{
          top.className="folder-fallback";
          top.textContent="SRS";
        };
        top.appendChild(img);
      }else{
        top.className="folder-fallback";
        top.textContent=slot.folder ? "SRS" : "EMPTY";
      }

      const segments=document.createElement("div");
      segments.className="segments";
      for(let i=0;i<possible;i++){
        const seg=document.createElement("span");
        seg.className="seg";
        if(i<achieved) seg.classList.add(complete?"complete":"progress");
        segments.appendChild(seg);
      }

      const foot=document.createElement("div");
      const name=document.createElement("div");
      name.className="rep-name";
      name.textContent=info?.name || slot.folder || `SRS ${index+1}`;
      const score=document.createElement("div");
      score.className="rep-score";
      score.textContent=possible ? `${achieved} / ${possible}` : "—";
      foot.append(name,score);

      card.append(top,segments,foot);
      grid.appendChild(card);
    });

    $("objective").textContent=next
      ? `${next.remaining} more song${next.remaining===1?"":"s"} to complete ${next.name}.`
      : "All selected repertoire folders are complete or not yet assigned.";
  }

  function renderStudent(index){
    const student=students[index];
    if(!student) return;
    $("studentName").textContent=student.name;
    $("credits").textContent=student.credits;
    renderPhoto(student);
    renderSkills(student);
    renderRepertoire(student);
  }

  function populateStudents(){
    const select=$("studentSelect");
    select.innerHTML="";
    students.forEach((s,i)=>{
      const o=document.createElement("option");
      o.value=String(i);
      o.textContent=s.name;
      select.appendChild(o);
    });
    if(students.length) renderStudent(0);
  }

  async function refresh(){
    clearError();
    setStatus("Loading Google Sheets");
    $("refreshBtn").disabled=true;
    try{
      const [studentsTable,libraryTable]=await Promise.all([
        loadTab(STUDENTS_TAB),
        loadTab(LIBRARY_TAB)
      ]);
      parseLibrary(tableObjects(libraryTable));
      students=parseStudents(tableObjects(studentsTable));
      if(!students.length) throw new Error('No student rows found in "Students".');
      populateStudents();
      $("lastUpdated").textContent=`Loaded ${new Date().toLocaleString()}`;
      setStatus("Google Sheets connected");
    }catch(err){
      showError(err.message || String(err));
    }finally{
      $("refreshBtn").disabled=false;
    }
  }

  $("studentSelect").addEventListener("change",e=>renderStudent(Number(e.target.value)));
  $("refreshBtn").addEventListener("click",refresh);
  refresh();
})();
</script>
</body>
</html>
